name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install package with pinned dependencies
        run: |
          uv venv --python 3.14
          uv pip install --python .venv/bin/python --constraints requirements.lock .
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Subscription adapter (mocked upstream)
        run: .venv/bin/python tests/check_adapter.py
      - name: Real local proxy lifecycle (no GPT calls)
        run: .venv/bin/python tests/check_lifecycle.py
      - name: Check installer syntax
        run: sh -n install.sh
